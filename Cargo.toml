[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/family-display/launcher",
  "crates/assistant-core",
  "crates/ai",
  "crates/database",
  "crates/display-api",
  "crates/display-server",
  "crates/email",
  "crates/inference-worker",
  "crates/notifications",
  "crates/rules"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
url = { version = "2.5", features = ["serde"] }
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

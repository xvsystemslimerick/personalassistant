[package]
name = "personal-assistant-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "personal_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
ai = { path = "../../../crates/ai" }
assistant-core = { path = "../../../crates/assistant-core" }
backup = { path = "../../../crates/backup" }
base64.workspace = true
chrono.workspace = true
database = { path = "../../../crates/database" }
display-server = { path = "../../../crates/display-server" }
notifications = { path = "../../../crates/notifications" }
email = { path = "../../../crates/email" }
inference-worker = { path = "../../../crates/inference-worker" }
rand.workspace = true
rules = { path = "../../../crates/rules" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "=2.7.3"
tokio.workspace = true
url.workspace = true
zeroize.workspace = true
tauri-plugin-notification = "2"
notify-rust = "=4.11.7"

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
objc2-user-notifications = { version = "0.3", features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

name: Production macOS release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: production-macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Require protected release credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          UPDATER_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_BASE64 }}
        run: |
          for value in "$CERTIFICATE" "$CERTIFICATE_PASSWORD" "$SIGNING_IDENTITY" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER" "$UPDATER_KEY"; do
            test -n "$value" || { echo "A protected production release credential is missing." >&2; exit 1; }
          done
      - name: Create ephemeral signing keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          UPDATER_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$UPDATER_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/updater.key"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/updater.key"
          security create-keychain -p "$KEYCHAIN_PASSWORD" release.keychain-db
          security set-keychain-settings -lut 21600 release.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" release.keychain-db
          security import "$RUNNER_TEMP/developer-id.p12" -k release.keychain-db -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" release.keychain-db
          security list-keychains -d user -s release.keychain-db
          xcrun notarytool store-credentials personal-assistant-ci --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
      - name: Build, sign, notarize, and qualify release
        env:
          PA_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          PA_NOTARY_KEYCHAIN_PROFILE: personal-assistant-ci
          PA_RELEASE_TAG: ${{ github.ref_name }}
          PA_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release-macos.sh
      - name: Publish exact tagged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "target/release/bundle/dmg/PersonalAssistant-$version.dmg" \
            "target/release/bundle/dmg/PersonalAssistant-$version.dmg.sha256" \
            "target/release/bundle/dmg/PersonalAssistant-$version-aarch64.app.tar.gz" \
            "target/release/bundle/dmg/PersonalAssistant-$version-aarch64.app.tar.gz.sig" \
            "target/release/bundle/dmg/latest.json" \
            "target/release/bundle/dmg/update-assets.sha256"
      - name: Remove ephemeral credentials
        if: always()
        run: |
          security delete-keychain release.keychain-db 2>/dev/null || true
          find "$RUNNER_TEMP" -maxdepth 1 -type f \( -name 'developer-id.p12' -o -name 'notary-key.p8' -o -name 'updater.key' \) -delete

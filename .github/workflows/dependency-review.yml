name: Dependency and SBOM review

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Test Rust workspace
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee /tmp/rust-test.log || {
            summary=$(tail -c 3500 /tmp/rust-test.log)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\n'/'%0A'}
            summary=${summary//$'\r'/'%0D'}
            echo "::error title=Rust workspace tests failed::$summary"
            exit 1
          }
      - name: Lint Rust workspace
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/rust-clippy.log || {
            summary=$(tail -c 3500 /tmp/rust-clippy.log)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\n'/'%0A'}
            summary=${summary//$'\r'/'%0D'}
            echo "::error title=Rust workspace lint failed::$summary"
            exit 1
          }
      - run: python3 scripts/generate-sbom.py outputs/personal-assistant.cdx.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: personal-assistant-sbom
          path: outputs/personal-assistant.cdx.json
          if-no-files-found: error

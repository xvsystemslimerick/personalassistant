name: Family Display ARM64 package

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/family-display/**"
      - "crates/display-api/**"
      - "scripts/package-family-display-deb.sh"
      - "scripts/test-family-display-package.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: rustup show
      - run: npm ci
      - run: npm run build --workspace apps/family-display
      - run: cargo test -p family-display-launcher --locked
      - run: cargo build -p family-display-launcher --release --locked
      - run: ./scripts/test-family-display-package.sh
      - run: ./scripts/package-family-display-deb.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: personal-assistant-display-arm64
          path: outputs/personal-assistant-display_*_arm64.deb
          if-no-files-found: error

[package]
name = "inference-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
persistent-backend-experimental = ["dep:ai"]

[dependencies]
ai = { path = "../ai", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "1.2"
sha2.workspace = true

[[bin]]
name = "personal-assistant-inference-worker"
path = "src/main.rs"

[[example]]
name = "persistent_fixture"
required-features = ["persistent-backend-experimental"]
